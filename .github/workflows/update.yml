name: auto-update
on:
  schedule: [{cron: "30 5 * * 1"}]   # weekly, after check-sources
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run autonomous adapters (CBS CPI, BoI rate)
        run: |
          set -o pipefail
          python3 scripts/update.py --apply 2>&1 | tee /tmp/upd.log
      - name: Commit and push data updates
        if: success()
        id: commit
        run: |
          if git diff --quiet data/data.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "rates-tracker-bot"
          git config user.email "actions@github.com"
          git add data/data.json
          git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Build site
        if: success() && steps.commit.outputs.changed == 'true'
        run: INDEX=1 SITE_URL=https://benimuler.github.io python3 scripts/build.py
      - uses: actions/configure-pages@v5
        if: success() && steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.commit.outputs.changed == 'true'
        with: {path: public}
      - id: deployment
        if: success() && steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "auto-update failed $(date -u +%Y-%m-%d)" --body "$(cat /tmp/upd.log 2>/dev/null || echo 'update.py failed; see workflow run log')" || true
