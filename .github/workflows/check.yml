name: check-sources
on:
  schedule: [{cron: "0 5 * * 1"}]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils
      - run: python3 scripts/check.py   # fails (and emails repo owner) when a published value no longer matches its official source
